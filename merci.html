<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Candidature reçue — IM Signature Apartments</title>
<style>
:root{--ink:#211f1b;--dark:#292622;--gold:#b39768;--cream:#f5f1e9;--muted:#746e64;--line:#e5dfd3}*{box-sizing:border-box}body{margin:0;background:var(--cream);color:var(--ink);font:16px/1.55 Inter,system-ui,-apple-system,"Segoe UI",sans-serif}.wrap{width:min(760px,calc(100% - 36px));margin:0 auto}.top{background:var(--dark);color:#f5f1e9;padding:12px 0;font-size:12px;letter-spacing:.08em}.card{margin:12vh auto;background:#fff;border:1px solid var(--line);padding:clamp(28px,7vw,64px);text-align:center}.mark{width:48px;height:48px;border:1px solid var(--gold);color:var(--gold);display:grid;place-items:center;margin:0 auto 24px;font:24px Georgia,serif}.eyebrow{font-size:11px;font-weight:700;letter-spacing:.14em;text-transform:uppercase;color:#78664b}.card h1{font:500 clamp(34px,5vw,50px)/1.12 Georgia,serif;margin:14px 0}.card p{color:var(--muted);max-width:520px;margin:0 auto 28px}.button{display:inline-flex;background:var(--dark);color:#fff;text-decoration:none;padding:13px 20px;font-weight:650;font-size:14px}.languages{position:absolute;top:12px;right:max(18px,calc((100vw - 760px)/2));display:flex;gap:4px}.languages button{border:1px solid transparent;background:transparent;padding:5px;cursor:pointer;color:#f5f1e9}.languages button[aria-pressed=true]{border-color:var(--gold)}
</style>
</head>
<body><div class="top"><div class="wrap">IM SIGNATURE APARTMENTS · FÈS</div></div><div class="languages" role="group" aria-label="Choisir la langue"><button data-lang="fr" aria-pressed="true">🇫🇷 FR</button><button data-lang="en" aria-pressed="false">🇬🇧 EN</button><button data-lang="es" aria-pressed="false">🇪🇸 ES</button></div>
<main class="wrap card"><div class="mark">IM</div><span class="eyebrow" data-fr="Candidature reçue" data-en="Application received" data-es="Solicitud recibida">Candidature reçue</span><h1 data-fr="Merci pour votre candidature." data-en="Thank you for applying." data-es="Gracias por tu solicitud.">Merci pour votre candidature.</h1><p data-fr="Votre formulaire a bien été transmis à la résidence. Nous reviendrons vers vous après examen de votre demande." data-en="Your form has been sent to the residence. We will get back to you after reviewing your application." data-es="Tu formulario se ha enviado a la residencia. Nos pondremos en contacto contigo tras revisar tu solicitud.">Votre formulaire a bien été transmis à la résidence. Nous reviendrons vers vous après examen de votre demande.</p><a class="button" href="index.html" data-fr="Retour au site" data-en="Back to website" data-es="Volver al sitio">Retour au site</a></main>
<script>(()=>{function choose(lang){document.documentElement.lang=lang;document.querySelectorAll('[data-fr]').forEach(e=>{const t=e.getAttribute('data-'+lang);if(t)e.textContent=t});document.querySelectorAll('[data-lang]').forEach(b=>b.setAttribute('aria-pressed',String(b.dataset.lang===lang)));try{localStorage.setItem('im-language',lang)}catch{}}document.querySelectorAll('[data-lang]').forEach(b=>b.addEventListener('click',()=>choose(b.dataset.lang)));let l='fr';try{if(['fr','en','es'].includes(localStorage.getItem('im-language')))l=localStorage.getItem('im-language')}catch{}choose(l)})();</script>
</body></html>
