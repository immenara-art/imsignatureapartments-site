<!doctype html><html lang="fr"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Demande envoyée — IM Signature Apartments</title><style>:root{--ink:#211f1b;--dark:#292622;--accent:#78664b;--gold:#b39768;--cream:#f5f1e9;--muted:#746e64;--line:#e5dfd3}*{box-sizing:border-box}body{margin:0;background:var(--cream);color:var(--ink);font:16px/1.55 Inter,system-ui,-apple-system,"Segoe UI",sans-serif;min-height:100vh;display:grid;place-items:center;padding:24px}.card{width:min(640px,100%);background:white;border:1px solid var(--line);padding:clamp(28px,7vw,60px);text-align:center}.mark{margin:0 auto 25px;width:48px;height:48px;border:1px solid var(--gold);color:var(--gold);display:grid;place-items:center;font:26px Georgia,serif}.eyebrow{text-transform:uppercase;letter-spacing:.14em;color:var(--accent);font-weight:700;font-size:11px}.card h1{font:500 clamp(34px,6vw,48px)/1.1 Georgia,serif;margin:14px 0}.card p{color:var(--muted);margin:0 0 28px}.button{display:inline-flex;background:var(--dark);color:white;padding:13px 20px;text-decoration:none;font-weight:650}.languages{display:flex;justify-content:center;gap:6px;margin-top:25px}.languages button{border:1px solid var(--line);background:white;padding:7px;cursor:pointer}</style></head><body><main class="card"><div class="mark">IM</div><span class="eyebrow" data-thanks="eyebrow">DEMANDE TRANSMISE</span><h1 data-thanks="title">Merci, votre demande a bien été envoyée.</h1><p data-thanks="body">La résidence va vérifier les disponibilités et vous recontacter. Votre séjour n’est pas encore réservé : il ne sera confirmé qu’après validation explicite de la résidence.</p><a class="button" href="index.html" data-thanks="back">Retour au site</a><div class="languages" role="group"><button type="button" data-lang="fr">🇫🇷 FR</button><button type="button" data-lang="en">🇬🇧 EN</button><button type="button" data-lang="es">🇪🇸 ES</button></div></main><script>const d={fr:{eyebrow:'DEMANDE TRANSMISE',title:'Merci, votre demande a bien été envoyée.',body:'La résidence va vérifier les disponibilités et vous recontacter. Votre séjour n’est pas encore réservé : il ne sera confirmé qu’après validation explicite de la résidence.',back:'Retour au site'},en:{eyebrow:'ENQUIRY SENT',title:'Thank you, your enquiry has been sent.',body:'The residence will check availability and contact you. Your stay is not reserved yet; it will only be confirmed after the residence explicitly approves it.',back:'Back to website'},es:{eyebrow:'SOLICITUD ENVIADA',title:'Gracias, hemos recibido tu solicitud.',body:'La residencia comprobará la disponibilidad y se pondrá en contacto contigo. Tu estancia todavía no está reservada; solo se confirmará cuando la residencia la apruebe expresamente.',back:'Volver al sitio'}};function choose(l){document.documentElement.lang=l;document.querySelectorAll('[data-thanks]').forEach(e=>e.textContent=d[l][e.dataset.thanks]);document.querySelectorAll('[data-lang]').forEach(e=>e.setAttribute('aria-pressed',String(e.dataset.lang===l)))}document.querySelectorAll('[data-lang]').forEach(e=>e.addEventListener('click',()=>choose(e.dataset.lang)));choose('fr');</script></body></html>
